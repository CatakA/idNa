<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; height: 100dvh;
    overflow: hidden; background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Arial', 'Helvetica', sans-serif;
    position: fixed; inset: 0;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas#fx { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; }

  /* ---- Пульсирующий красный свет ---- */
  .pulse {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at center, rgba(255,0,0,0.35), transparent 70%);
    opacity: 0;
    animation: pulseAnim 7s ease-in forwards;
  }
  @keyframes pulseAnim {
    0%   { opacity: 0; }
    20%  { opacity: 0.15; }
    50%  { opacity: 0.35; }
    80%  { opacity: 0.7; }
    100% { opacity: 1; }
  }

  .vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(circle at center, transparent 30%, #000 100%);
  }

  /* ---- Сканлайны ---- */
  .scanlines {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: repeating-linear-gradient(
      0deg, rgba(255,0,0,0.05) 0px, rgba(255,0,0,0.05) 2px,
      transparent 2px, transparent 4px);
    animation: scanMove 0.4s linear infinite;
    opacity: 0;
    animation: scanMove 0.4s linear infinite, scanFade 7s ease-in forwards;
  }
  @keyframes scanMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 8px; }
  }
  @keyframes scanFade {
    0% { opacity: 0; }
    100% { opacity: 0.6; }
  }

  /* ---- Глитч ---- */
  .glitch {
    position: fixed; inset: 0; z-index: 6; pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
  }
  .glitch.active {
    animation: glitchAnim 0.15s steps(2) infinite;
    opacity: 0.4;
    background:
      linear-gradient(90deg, transparent 0%, #f00 15%, transparent 30%),
      linear-gradient(90deg, transparent 55%, #0ff 70%, transparent 85%);
  }
  @keyframes glitchAnim {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-8px, 4px); }
    50%  { transform: translate(6px, -5px); }
    75%  { transform: translate(-4px, -2px); }
    100% { transform: translate(0,0); }
  }

  /* ---- Вспышки ---- */
  .flash {
    position: fixed; inset: 0; z-index: 7; pointer-events: none;
    background: #fff; opacity: 0;
  }
  .flash.fire { animation: flashAnim 0.25s ease-out; }
  @keyframes flashAnim {
    0% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  /* ---- Тряска экрана ---- */
  .shake {
    animation: shakeAnim 0.08s infinite;
  }
  @keyframes shakeAnim {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-2px, 1px); }
    50%  { transform: translate(2px, -1px); }
    75%  { transform: translate(-1px, -2px); }
    100% { transform: translate(0, 0); }
  }

  /* ---- Текст ---- */
  .text {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: 0 6vw;
    color: #fff;
    font-size: clamp(22px, 7vw, 64px);
    font-weight: 300;
    letter-spacing: 0.02em;
    line-height: 1.25;
    opacity: 0;
  }

  #first {
    animation: textDrama 7s ease-in-out forwards;
    text-shadow: 0 0 20px rgba(255,0,0,0);
  }
  @keyframes textDrama {
    0%   { opacity: 0; filter: blur(14px); transform: scale(0.9); text-shadow: 0 0 0 rgba(255,0,0,0); }
    20%  { opacity: 1; filter: blur(0);   transform: scale(1);   text-shadow: 0 0 10px rgba(255,0,0,0.3); }
    60%  { opacity: 1; filter: blur(0);   transform: scale(1);   text-shadow: 0 0 25px rgba(255,0,0,0.6); }
    85%  { opacity: 1; filter: blur(0);   transform: scale(1.05); text-shadow: 0 0 40px rgba(255,0,0,0.9); }
    100% { opacity: 0; filter: blur(16px); transform: scale(1.3); text-shadow: 0 0 60px rgba(255,0,0,1); }
  }

  #videoWrap {
    position: fixed; inset: 0; z-index: 10;
    background: #000;
    display: none;
    width: 100%; height: 100dvh;
  }
  #videoWrap.show { display: block; }
  #videoWrap video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
  }

  #tapHint {
    position: fixed; inset: 0; z-index: 20;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: clamp(16px, 5vw, 28px);
    text-align: center;
    padding: 0 10vw;
    cursor: pointer;
  }
  #tapHint.show { display: flex; }

  @media (orientation: landscape) and (max-height: 500px) {
    .text { font-size: clamp(18px, 5vh, 42px); }
  }
</style>
</head>
<body class="shake">

<canvas id="fx"></canvas>
<div class="pulse"></div>
<div class="vignette"></div>
<div class="scanlines"></div>
<div class="glitch" id="glitch"></div>
<div class="flash" id="flash"></div>

<div class="text" id="first">Я давно хотел тебе сказать…</div>

<div id="videoWrap">
  <video id="memeVideo" src="1.mp4" playsinline webkit-playsinline preload="metadata" loop muted></video>
</div>

<div id="tapHint">👆 тапни, чтобы включить звук</div>

<script>
// ============ ФОН: частицы, летящие к центру ============
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let W, H, DPR, cx, cy;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W / 2; cy = H / 2;
}
resize();
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const COUNT = isMobile ? 70 : 130;

const parts = [];
function spawnParticle(initial = false) {
  const angle = Math.random() * Math.PI * 2;
  const dist = initial ? Math.random() * Math.max(W, H) : Math.max(W, H) * 0.8;
  const speed = 0.6 + Math.random() * 1.6;
  return {
    x: cx + Math.cos(angle) * dist,
    y: cy + Math.sin(angle) * dist,
    angle,
    speed,
    r: Math.random() * 1.8 + 0.5,
    a: Math.random() * 0.5 + 0.3,
    hue: Math.random() < 0.7 ? 0 : 20 // красные/оранжевые
  };
}
for (let i = 0; i < COUNT; i++) parts.push(spawnParticle(true));

function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    // движутся к центру
    p.x += Math.cos(p.angle + Math.PI) * p.speed;
    p.y += Math.sin(p.angle + Math.PI) * p.speed;
    // если улетел за центр — респавн снаружи
    const dx = p.x - cx, dy = p.y - cy;
    if (Math.hypot(dx, dy) < 8) {
      parts[i] = spawnParticle(false);
      continue;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 100%, 55%, ${p.a})`;
    ctx.shadowBlur = 12;
    ctx.shadowColor = `hsl(${p.hue}, 100%, 55%)`;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  requestAnimationFrame(draw);
}
draw();

// ============ ГЛИТЧИ + ВСПЫШКИ, нарастающие к финалу ============
const glitch = document.getElementById('glitch');
const flash = document.getElementById('flash');

function fireFlash() {
  flash.classList.remove('fire');
  void flash.offsetWidth;
  flash.classList.add('fire');
}

// серия случайных глитчей и вспышек с нарастающей частотой
let t = 0;
const glitchLoop = setInterval(() => {
  t += 250;
  const intensity = t / 7000; // 0..1
  if (Math.random() < 0.3 + intensity * 0.6) {
    glitch.classList.add('active');
    setTimeout(() => glitch.classList.remove('active'), 60 + Math.random() * 180);
  }
  if (Math.random() < 0.15 + intensity * 0.5) {
    fireFlash();
  }
  if (t >= 7000) clearInterval(glitchLoop);
}, 250);

// тряска экрана нарастает
setTimeout(() => { document.body.classList.add('shake'); }, 2500);
// вибрация телефона в такт (если поддерживается)
if (navigator.vibrate) {
  let vib = 0;
  const vibLoop = setInterval(() => {
    vib += 300;
    if (vib > 7000) { clearInterval(vibLoop); return; }
    const intensity = vib / 7000;
    if (Math.random() < intensity * 0.7) {
      navigator.vibrate(20 + Math.floor(intensity * 60));
    }
  }, 300);
}

// ============ ВИДЕО: гарантия тишины до финала ============
const videoWrap = document.getElementById('videoWrap');
const video = document.getElementById('memeVideo');
const tapHint = document.getElementById('tapHint');
let unlocked = false;

video.pause();
video.currentTime = 0;
video.muted = true;

video.addEventListener('play', () => {
  if (!videoWrap.classList.contains('show')) {
    video.pause();
    video.currentTime = 0;
  }
});

// ============ ФИНАЛ ============
setTimeout(() => {
  document.getElementById('first').style.display = 'none';
  glitch.classList.remove('active');
  document.body.classList.remove('shake');

  // резкая вспышка перед видео
  fireFlash();

  videoWrap.classList.add('show');
  video.pause();
  video.currentTime = 0;
  video.muted = true;

  const p = video.play();
  if (p && typeof p.then === 'function') {
    p.catch(() => { video.controls = true; });
  }

  tapHint.classList.add('show');

  video.addEventListener('ended', () => {
    video.currentTime = 0;
    video.play().catch(() => {});
  });

  document.body.style.cursor = 'none';
  if (navigator.vibrate) navigator.vibrate([120, 60, 180]);
}, 7000);

// ============ Звук по тапу ============
function unlockSound() {
  if (unlocked) return;
  unlocked = true;
  tapHint.classList.remove('show');
  video.muted = false;
  video.play().catch(() => {});
}
tapHint.addEventListener('click', unlockSound);
document.body.addEventListener('click', unlockSound);

// ============ Мелочи ============
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && videoWrap.classList.contains('show') && video.paused) {
    video.play().catch(() => {});
  }
});
</script>
</body>
</html>
